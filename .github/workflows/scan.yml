name: MA scan and publish

on:
  push:
    branches: [main]
  schedule:
    # 평일 16:40 KST = 07:40 UTC (장 마감 후). GitHub 예약은 몇 분~수십 분 늦어질 수 있음
    - cron: "40 7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Naver reachability check
        run: |
          {
            curl -s -o /dev/null -m 20 -w "mobile api: %{http_code}\n" "https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=5" -A "Mozilla/5.0" || echo "mobile api: fail"
            curl -s -o /dev/null -m 20 -w "fchart: %{http_code}\n" "https://fchart.stock.naver.com/sise.nhn?symbol=005930&timeframe=day&count=5&requestType=0" -A "Mozilla/5.0" || echo "fchart: fail"
          } | tee net_check.txt

      - name: Run scan
        id: scan
        continue-on-error: true
        run: python scan_ma.py

      - name: Show log
        if: always()
        run: cat scan_log.txt || true

      - name: Prepare site
        run: |
          mkdir -p site
          { echo "== net check =="; cat net_check.txt; echo; echo "== scan log =="; cat scan_log.txt; } > site/log.txt 2>&1 || true
          cp results/latest.html site/index.html || echo "scan failed - see log.txt" > site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
