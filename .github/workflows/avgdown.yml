name: Avgdown

on:
  workflow_dispatch: {}
  push:
    paths:
      - avgdown.py
      - .github/workflows/avgdown.yml

permissions:
  contents: write

jobs:
  avgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt numba

      - name: Run avgdown
        id: ex
        continue-on-error: true
        run: python avgdown.py

      - name: Save result to repo
        run: |
          mkdir -p avgdown
          cp avgdown_result.md avgdown/result.md || true
          cp scan_log.txt avgdown/log.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add avgdown
          git commit -m "avgdown result" || exit 0
          git pull --rebase origin main
          git push

      - name: Fail if avgdown failed
        if: steps.ex.outcome == 'failure'
        run: exit 1
