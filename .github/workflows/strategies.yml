name: Strategies

on:
  workflow_dispatch: {}
  push:
    paths:
      - strategies.py
      - .github/workflows/strategies.yml

permissions:
  contents: write

jobs:
  strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt numba

      - name: Run strategies
        id: ex
        continue-on-error: true
        run: python strategies.py

      - name: Save result to repo
        run: |
          mkdir -p strategies
          cp strategies_result.md strategies/result.md || true
          cp strategies_all.csv strategies/all.csv || true
          cp scan_log.txt strategies/log.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add strategies
          git commit -m "strategies result" || exit 0
          git pull --rebase origin main
          git push

      - name: Fail if strategies failed
        if: steps.ex.outcome == 'failure'
        run: exit 1
